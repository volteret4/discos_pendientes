# Instalación por separado. Dentro de REPEAT-ONE se usa el docker-compose.yml de REPEAT-ONE.
services:
  discos-pendientes:
    build: .
    restart: unless-stopped
    user: "${UID_GID:-1000:1000}"
    env_file:
      - path: .env
        required: false
    environment:
      - HOME=/tmp
      - PYTHONDONTWRITEBYTECODE=1
      - DB_PATH=/app/discos_pendientes.db
      - MUSICA_LOCAL_DB=/musica_local/musica_local.sqlite
      - LASTFM_DB=/data/lastfm_stats.db
      - TRASVASE_DB=/trasvase/music.db
    volumes:
      - .:/app
      - ${MUSICA_LOCAL_DIR:-./datos/musica_local}:/musica_local:ro
      - ${LASTFM_DIR:-./datos/lastfm}:/data:ro
      - ${TRASVASE_DIR:-./datos/trasvase}:/trasvase:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PUERTO:-8773}:5000"
    labels:
      ofelia.enabled: "true"
      repeat-one.ofelia: "discos_pendientes"
      ofelia.job-exec.discos-pendientes-daily.schedule: "0 40 0 * * *"
      ofelia.job-exec.discos-pendientes-daily.command: "nice -n 19 ionice -c 3 python3 sync.py"

  # Ofelia lanza los trabajos programados de las etiquetas ofelia.job-exec.* de arriba
  # (los mismos horarios que en REPEAT-ONE). Solo ve los contenedores de este repo.
  # Si no quieres actualizaciones automáticas: docker compose stop ofelia
  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    command: daemon --docker --docker-filter=label=repeat-one.ofelia=discos_pendientes
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - discos-pendientes
